x-bundle-volumes: &bundle-volumes
  - type: bind
    source: ${SOLAR_INTEGRATION_DEPLOYMENT_DIRECTORY:?Set signed deployment bundle directory}/integration-bundle
    target: /app/integration-bundle
    read_only: true
  - type: bind
    source: ${SOLAR_INTEGRATION_DEPLOYMENT_DIRECTORY:?Set signed deployment bundle directory}/integration-bootstrap.json
    target: /app/integration-bootstrap.json
    read_only: true

services:
  migration:
    volumes: *bundle-volumes
  deye-solar:
    volumes: *bundle-volumes
