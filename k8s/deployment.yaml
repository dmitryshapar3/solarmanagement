apiVersion: apps/v1
kind: Deployment
metadata:
  name: deye-solar
  namespace: deye-solar
  labels:
    app: deye-solar
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: deye-solar
  template:
    metadata:
      labels:
        app: deye-solar
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: deye-solar
          image: SOLAR_RELEASE_IMAGE
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: Auth__DataProtectionKeysPath
              value: "/data/keys"
            - name: Integrations__KeyRingPath
              value: "/data/keys/integrations"
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: deye-solar-database
                  key: runtime-connection
            - name: Operations__DatabaseMode
              value: validate
            - name: Shelly__ServerUri
              valueFrom:
                secretKeyRef:
                  name: deye-solar-shelly
                  key: server-uri
                  optional: true
            - name: Shelly__AuthKey
              valueFrom:
                secretKeyRef:
                  name: deye-solar-shelly
                  key: auth-key
                  optional: true
            - name: Shelly__DeviceId
              valueFrom:
                secretKeyRef:
                  name: deye-solar-shelly
                  key: device-id
                  optional: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: integration-packages
              mountPath: /data/integration-packages
            - name: protection-keys
              mountPath: /data/keys
            - name: integration-bundle
              mountPath: /app/integration-bundle
              subPath: integration-bundle
              readOnly: true
            - name: integration-bundle
              mountPath: /app/integration-bootstrap.json
              subPath: integration-bootstrap.json
              readOnly: true
          startupProbe:
            httpGet:
              path: /health/live
              port: 8080
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: integration-packages
          persistentVolumeClaim:
            claimName: deye-solar-integration-packages
        - name: protection-keys
          persistentVolumeClaim:
            claimName: deye-solar-protection-keys
        - name: integration-bundle
          persistentVolumeClaim:
            claimName: deye-solar-integration-bundle
