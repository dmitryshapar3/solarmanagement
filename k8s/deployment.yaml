apiVersion: apps/v1
kind: Deployment
metadata:
  name: deye-solar
  namespace: deye-solar
  labels:
    app: deye-solar
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deye-solar
  template:
    metadata:
      labels:
        app: deye-solar
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: deye-solar
          image: ghcr.io/dmitryshapar3/deye-solar:latest
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: Auth__DataProtectionKeysPath
              value: "/data/keys"
            - name: Integrations__KeyRingPath
              value: "/data/keys/integrations"
            - name: ConnectionStrings__DefaultConnection
              value: "Server=sqlserver-service.production.svc.cluster.local,1433;Database=DeyeSolar;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;MultipleActiveResultSets=true"
            - name: Shelly__ServerUri
              valueFrom:
                secretKeyRef:
                  name: deye-solar-shelly
                  key: server-uri
                  optional: true
            - name: Shelly__AuthKey
              valueFrom:
                secretKeyRef:
                  name: deye-solar-shelly
                  key: auth-key
                  optional: true
            - name: Shelly__DeviceId
              valueFrom:
                secretKeyRef:
                  name: deye-solar-shelly
                  key: device-id
                  optional: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: integration-packages
              mountPath: /data/integration-packages
            - name: protection-keys
              mountPath: /data/keys
            - name: integration-bundle
              mountPath: /app/integration-bundle
              subPath: integration-bundle
              readOnly: true
            - name: integration-bundle
              mountPath: /app/integration-bootstrap.json
              subPath: integration-bootstrap.json
              readOnly: true
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: integration-packages
          persistentVolumeClaim:
            claimName: deye-solar-integration-packages
        - name: protection-keys
          persistentVolumeClaim:
            claimName: deye-solar-protection-keys
        - name: integration-bundle
          persistentVolumeClaim:
            claimName: deye-solar-integration-bundle
